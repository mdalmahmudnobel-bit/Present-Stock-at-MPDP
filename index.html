<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory Stock Viewer</title>
  <style>
    :root{--bg:#f3f6fb;--line:#dce4ee;--text:#172033;--muted:#64748b}
    *{box-sizing:border-box}body{margin:0;padding:10px;background:var(--bg);color:var(--text);font:13px Arial,sans-serif}
    .app{max-width:1600px;margin:auto}.hero{background:#1d4ed8;border:1px solid #1e40af;border-radius:8px;padding:12px 14px;margin-bottom:8px;min-height:48px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(29,78,216,.18)}
    .hero h1{margin:0;padding:0;font-size:20px;line-height:1.25;font-weight:800;white-space:nowrap;color:#fff;text-align:center}
    .summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:8px}.stat{border:1px solid var(--line);border-radius:8px;padding:9px 11px}
    .stat-label{color:#334155;font-size:11px;font-weight:700;margin-bottom:4px}.stat-value{font-size:21px;font-weight:800;line-height:1.1}.total{background:#dbeafe;border-color:#93c5fd}.available{background:#dcfce7;border-color:#86efac}.out{background:#fee2e2;border-color:#fca5a5}.total .stat-value{color:#1d4ed8}.available .stat-value{color:#15803d}.out .stat-value{color:#b91c1c}
    .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-bottom:8px}.field{display:flex;align-items:center;gap:6px;min-height:34px;padding:5px 8px;background:#fff;border:1px solid var(--line);border-radius:6px}
    .field label{color:#475569;font-size:11px;font-weight:700;white-space:nowrap}.field input,.field select{min-width:110px;width:100%;border:0;outline:0;background:transparent;color:#1e293b;font:inherit}
    .search-field{flex:1 1 220px}.search-field input{min-width:80px}.location-field,.status-field{flex:0 1 auto}
    .btn{min-height:34px;border:0;border-radius:6px;padding:7px 12px;background:#1d4ed8;color:#fff;font-size:12px;font-weight:700;cursor:pointer}.btn.secondary{background:#334155}.btn:disabled{opacity:.6;cursor:wait}
    .error{display:none;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:6px;padding:9px;margin-bottom:8px;overflow-wrap:anywhere;white-space:pre-wrap}
    .table-card{background:#fff;border:1px solid var(--line);border-radius:7px;overflow:hidden}.table-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:#f8fafc;border-bottom:1px solid var(--line)}.table-top strong{font-size:12px}.status{font-size:11px;color:var(--muted)}
    .table-wrap{overflow:auto;max-height:calc(100vh - 225px);min-height:190px}table{width:1320px;min-width:1320px;table-layout:fixed;border-collapse:separate;border-spacing:0}th,td{height:32px;padding:7px 9px;border-right:1px solid #e8edf4;border-bottom:1px solid #e8edf4;text-align:left;white-space:nowrap}
    th{position:sticky;top:0;z-index:5;font-size:11px;font-weight:800}td{font-size:12px}
    th:nth-child(1),td:nth-child(1){background:#eef2ff}th:nth-child(2),td:nth-child(2){background:#eff6ff}th:nth-child(3),td:nth-child(3){background:#f0fdfa}th:nth-child(4),td:nth-child(4){background:#ecfdf5}th:nth-child(5),td:nth-child(5){background:#fff7ed}th:nth-child(6),td:nth-child(6){background:#f5f3ff}th:nth-child(7),td:nth-child(7){background:#fdf2f8}th:nth-child(8),td:nth-child(8){background:#fefce8}th:nth-child(9),td:nth-child(9){background:#f1f5f9}
    th:nth-child(1){background:#dbeafe}th:nth-child(2){background:#dbeafe}th:nth-child(3){background:#ccfbf1}th:nth-child(4){background:#bbf7d0}th:nth-child(5){background:#fed7aa}th:nth-child(6){background:#ddd6fe}th:nth-child(7){background:#fbcfe8}th:nth-child(8){background:#fef08a}th:nth-child(9){background:#e2e8f0}
    /* Freeze only the first SL No. column during horizontal scrolling */
    th:nth-child(1),td:nth-child(1){position:sticky;left:0;width:60px;min-width:60px;max-width:60px;z-index:7}
    th:nth-child(2),td:nth-child(2){width:420px;min-width:420px;max-width:420px;overflow:hidden;text-overflow:ellipsis}
    th:nth-child(3),td:nth-child(3){width:80px;min-width:80px;max-width:80px}
    th:nth-child(4),td:nth-child(4){width:100px;min-width:100px;max-width:100px}
    thead th:nth-child(1){z-index:10}
    /* Center Unit and quantity/stock columns */
    th:nth-child(3),td:nth-child(3),th:nth-child(n+4):nth-child(-n+8),td:nth-child(n+4):nth-child(-n+8){text-align:center}
    .hero{text-align:center}.hero h1{text-align:center}
    td.num{text-align:center;font-variant-numeric:tabular-nums}
    td.num{text-align:center;font-variant-numeric:tabular-nums}td.stock-positive{color:#166534;font-weight:800}td.stock-zero{color:#b91c1c;font-weight:800}td.stock-negative{color:#991b1b;background:#fee2e2!important;font-weight:800}
    .empty{padding:25px 10px;text-align:center;color:var(--muted)}.footer{padding:6px 2px 0;text-align:right;font-size:10px;color:var(--muted)}
    @media(max-width:700px){body{padding:6px}.hero{padding:10px 7px;margin-bottom:6px;min-height:44px}.hero h1{font-size:18px}.summary{gap:5px}.stat{padding:7px;border-radius:6px}.stat-label{font-size:9px;line-height:1.25}.stat-value{font-size:18px}.toolbar{gap:5px}.field{flex:1 1 100%}.field input,.field select{min-width:0;width:100%}.btn{flex:1}.table-wrap{max-height:calc(100vh - 265px)}th,td{padding:6px 5px}
      /* On mobile, freeze only SL No.; let all other columns scroll */
      th:nth-child(1),td:nth-child(1){left:0;width:60px;min-width:60px;max-width:60px;z-index:7}
      thead th:nth-child(1){z-index:10}
      th:nth-child(2),td:nth-child(2){width:420px;min-width:420px;max-width:420px;overflow:hidden;text-overflow:ellipsis}
      th:nth-child(3),td:nth-child(3){width:80px;min-width:80px;max-width:80px;text-align:center}
      th:nth-child(4),td:nth-child(4){width:100px;min-width:100px;max-width:100px}
      th:nth-child(n+4):nth-child(-n+8),td:nth-child(n+4):nth-child(-n+8){text-align:center}
    }
  </style>
</head>
<body>
<main class="app">
  <header class="hero"><h1>Inventory Stock Viewer</h1></header>
  <div id="errorBox" class="error" role="alert"></div>
  <section class="summary">
    <div class="stat total"><div class="stat-label">Total Spare Parts</div><div class="stat-value" id="totalCount">—</div></div>
    <div class="stat available"><div class="stat-label">Available Stock</div><div class="stat-value" id="availableCount">—</div></div>
    <div class="stat out"><div class="stat-label">Out of Stock / Minus</div><div class="stat-value" id="outCount">—</div></div>
  </section>
  <section class="toolbar">
    <div class="field search-field"><label for="partSearch">Search</label><input id="partSearch" type="search" placeholder="Search spare parts name..." autocomplete="off"></div>
    <div class="field location-field"><label for="locationSearch">Location</label><input id="locationSearch" type="search" placeholder="Search location..." autocomplete="off"></div>
    <div class="field status-field"><label for="stockFilter">Stock Status</label><select id="stockFilter"><option value="all">All Stock</option><option value="available">Available Stock (+)</option><option value="zero">Out of Stock (Zero)</option><option value="minus">Minus Stock (-)</option></select></div>
    <button class="btn" id="refreshBtn" type="button">↻ Refresh</button><button class="btn secondary" id="exportBtn" type="button">Export CSV</button>
  </section>
  <section class="table-card">
    <div class="table-top"><strong>Spare Parts Stock Details</strong><span class="status" id="rowCount">Loading inventory…</span></div>
    <div class="table-wrap"><table><colgroup><col style="width:60px"><col style="width:420px"><col style="width:80px"><col style="width:100px"><col style="width:90px"><col style="width:90px"><col style="width:90px"><col style="width:90px"><col style="width:300px"></colgroup><thead><tr><th>SL No.</th><th>Parts Name</th><th>Unit</th><th>Present Stock</th><th>Issue Qty</th><th>MRR Qty</th><th>TRNR Qty</th><th>TRNS Qty</th><th>Location</th></tr></thead><tbody id="tableBody"><tr><td colspan="9" class="empty">Loading inventory data…</td></tr></tbody></table></div>
  </section>
  <div class="footer" id="lastUpdated">Not synced yet</div>
</main>
<script>
  // Paste the deployed Google Apps Script Web App URL here.
  const API_URL = 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';
  let allRows = [];
  let requestTimer = null;
  const $ = id => document.getElementById(id);
  const safe = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const numberText = value => Number(value || 0).toLocaleString('en-US', {maximumFractionDigits:3});
  function showError(message){const box=$('errorBox');box.textContent=message||'Unable to load inventory data.';box.style.display='block';}
  function clearError(){$('errorBox').style.display='none';}
  function loadInventory(){
    clearError();$('refreshBtn').disabled=true;$('refreshBtn').textContent='Loading…';$('rowCount').textContent='Loading inventory…';
    if(!API_URL || API_URL.includes('PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE')){
      showError('Setup required: README.md-এর নির্দেশনা অনুযায়ী Apps Script Web App URL index.html-এর API_URL-এ বসান।');
      $('rowCount').textContent='API URL not configured';$('refreshBtn').disabled=false;$('refreshBtn').textContent='↻ Refresh';return;
    }
    // JSONP allows the GitHub Pages site to request data from Apps Script without CORS fetch issues.
    const callbackName='inventoryCallback_'+Date.now()+'_'+Math.floor(Math.random()*100000);
    const script=document.createElement('script');
    let finished=false;
    const cleanup=()=>{if(finished)return;finished=true;clearTimeout(requestTimer);delete window[callbackName];script.remove();$('refreshBtn').disabled=false;$('refreshBtn').textContent='↻ Refresh';};
    window[callbackName]=data=>{
      cleanup();
      if(!data || data.error){showError(data&&data.error?data.error:'The inventory API returned an invalid response.');$('rowCount').textContent='Could not load data';return;}
      allRows=Array.isArray(data.rows)?data.rows:[];const summary=data.summary||{};
      $('totalCount').textContent=numberText(summary.total??allRows.length);
      $('availableCount').textContent=numberText(summary.available??allRows.filter(r=>Number(r.stock)>0).length);
      $('outCount').textContent=numberText(summary.out??allRows.filter(r=>Number(r.stock)<=0).length);
      $('lastUpdated').textContent='Last synced: '+new Date(data.updatedAt||Date.now()).toLocaleString();renderTable();
    };
    script.onerror=()=>{cleanup();showError('Could not connect to Apps Script. Check the Web App URL, deployment access, and Code.gs API setup.');$('rowCount').textContent='Could not load data';};
    script.src=API_URL+(API_URL.includes('?')?'&':'?')+'api=1&callback='+encodeURIComponent(callbackName)+'&_='+Date.now();
    document.head.appendChild(script);
    requestTimer=setTimeout(()=>{cleanup();showError('Request timed out. Check that the Apps Script Web App is deployed and accessible.');$('rowCount').textContent='Request timed out';},20000);
  }
  function filteredRows(){const query=$('partSearch').value.trim().toLowerCase();const location=$('locationSearch').value.trim().toLowerCase();const status=$('stockFilter').value;
    return allRows.filter(row=>{const stock=Number(row.stock||0);if(query&&!String(row.name||'').toLowerCase().includes(query))return false;if(location&&!String(row.location||'').toLowerCase().includes(location))return false;if(status==='available'&&stock<=0)return false;if(status==='zero'&&stock!==0)return false;if(status==='minus'&&stock>=0)return false;return true;});}
  function renderTable(){const rows=filteredRows();$('rowCount').textContent=numberText(rows.length)+' item(s) shown';if(!rows.length){$('tableBody').innerHTML='<tr><td colspan="9" class="empty">No matching spare parts found.</td></tr>';return;}
    $('tableBody').innerHTML=rows.map((row,index)=>{const stock=Number(row.stock||0);let cls='stock-positive';if(stock===0)cls='stock-zero';if(stock<0)cls='stock-negative';return `<tr><td>${safe(row.sl||index+1)}</td><td title="${safe(row.name)}">${safe(row.name)}</td><td>${safe(row.unit)}</td><td class="num ${cls}">${numberText(stock)}</td><td class="num">${numberText(row.issue)}</td><td class="num">${numberText(row.mrr)}</td><td class="num">${numberText(row.trnr)}</td><td class="num">${numberText(row.trns)}</td><td>${safe(row.location||'Not specified')}</td></tr>`;}).join('');}
  function exportCsv(){const rows=filteredRows();const headers=['SL No.','Parts Name','Unit','Present Stock','Issue Qty','MRR Qty','TRNR Qty','TRNS Qty','Location'];const values=rows.map(r=>[r.sl,r.name,r.unit,r.stock,r.issue,r.mrr,r.trnr,r.trns,r.location]);const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv='\uFEFF'+[headers,...values].map(row=>row.map(quote).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='inventory-stock-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  $('partSearch').addEventListener('input',renderTable);$('locationSearch').addEventListener('input',renderTable);$('stockFilter').addEventListener('change',renderTable);$('refreshBtn').addEventListener('click',loadInventory);$('exportBtn').addEventListener('click',exportCsv);loadInventory();
</script>
</body>
</html>
